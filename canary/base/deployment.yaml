apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
      - name: caddy
        image: caddy:2.7
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/caddy
      volumes:
      - name: html
        configMap:
          name: placeholder-html

